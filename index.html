<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Property Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Lora:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f8fa;--surf:#fff;--surf2:#f0f2f5;--border:#dde1e9;--border2:#c8cdd8;
  --accent:#2563eb;--accent2:#1d4ed8;--gold:#b45309;--green:#16a34a;--red:#dc2626;
  --grey:#9ca3af;--txt:#111827;--txt2:#4b5563;--txt3:#9ca3af;
}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt)}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.btn{border:none;padding:7px 14px;font-family:'DM Mono',monospace;font-size:.68rem;cursor:pointer;border-radius:4px;letter-spacing:.04em;transition:background .15s;white-space:nowrap}
.btn-pri{background:var(--accent);color:#fff}.btn-pri:hover{background:#1d4ed8}
.btn-sec{background:transparent;border:1px solid var(--border2);color:var(--txt2)}.btn-sec:hover{border-color:var(--accent);color:var(--accent)}
.btn-gold{background:rgba(180,83,9,.1);border:1px solid rgba(180,83,9,.25);color:var(--gold)}.btn-gold:hover{background:rgba(180,83,9,.18)}
.btn-gold:disabled{opacity:.4;cursor:not-allowed}
.btn-green{background:rgba(22,163,74,.1);border:1px solid rgba(22,163,74,.25);color:var(--green)}.btn-green:hover{background:rgba(22,163,74,.18)}
.hdr{background:var(--surf);border-bottom:1px solid var(--border);padding:0 16px;height:46px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.logo{font-family:'Lora',serif;font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:6px;flex-shrink:0}
.logo span{color:var(--accent)}
.legend{display:flex;align-items:center;gap:8px}
.leg-item{display:flex;align-items:center;gap:3px;font-family:'DM Mono',monospace;font-size:.57rem;color:var(--txt3)}
.leg-dot{width:9px;height:9px;border-radius:50%}
.spacer{flex:1}
.total{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--txt3);flex-shrink:0}
.toolbar{background:var(--surf2);border-bottom:1px solid var(--border);padding:6px 14px;display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap}
.toolbar-sep{width:1px;height:18px;background:var(--border2);margin:0 2px;flex-shrink:0}
.tlabel{font-family:'DM Mono',monospace;font-size:.57rem;text-transform:uppercase;letter-spacing:.08em;color:var(--txt3);flex-shrink:0}
.tier-wrap{display:flex;align-items:center;gap:4px}
.tier-lbl{font-family:'DM Mono',monospace;font-size:.6rem;flex-shrink:0}
.tier-lbl.green{color:var(--green)}.tier-lbl.gold{color:var(--gold)}.tier-lbl.red{color:var(--red)}
.tier-input{background:var(--bg);border:1px solid var(--border2);color:var(--txt);padding:4px 6px;font-family:'DM Mono',monospace;font-size:.65rem;border-radius:4px;outline:none;width:95px}
.tier-input:focus{border-color:var(--accent)}
.prog-wrap{display:flex;align-items:center;gap:6px;margin-left:auto}
.prog-bar{width:140px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.prog-lbl{font-family:'DM Mono',monospace;font-size:.57rem;color:var(--txt3);white-space:nowrap}
.main{display:flex;flex:1;overflow:hidden}
#map{flex:1;z-index:1}
.sidebar{width:340px;background:var(--surf);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.srch{padding:7px 9px;border-bottom:1px solid var(--border);background:var(--surf2)}
.srch input{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--txt);padding:5px 9px;font-family:'DM Sans',sans-serif;font-size:.74rem;border-radius:4px;outline:none}
.srch input:focus{border-color:var(--accent)}
.srch input::placeholder{color:var(--txt3)}
.clist{flex:1;overflow-y:auto}
.citem{padding:9px 11px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:flex-start;gap:8px;transition:background .1s;position:relative}
.citem:hover{background:var(--surf2)}
.citem.active{background:rgba(37,99,235,.06);border-left:2px solid var(--accent)}
.citem.active .cname{color:var(--accent)}
.citem.dimmed{opacity:.2}
.pindot{width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:.5rem;color:#fff;flex-shrink:0;margin-top:1px;background:var(--grey)}
.pindot.green{background:var(--green)}.pindot.gold{background:var(--gold);color:#333}.pindot.red{background:var(--red)}
.cname{font-size:.78rem;font-weight:500;color:var(--txt);line-height:1.2}
.caddr{font-size:.65rem;color:var(--txt2);margin-top:2px;line-height:1.3}
.cphone{font-size:.62rem;color:var(--txt3);margin-top:2px;font-family:'DM Mono',monospace}
.cval{font-size:.62rem;font-family:'DM Mono',monospace;margin-top:2px}
.cval.green{color:var(--green)}.cval.gold{color:var(--gold)}.cval.red{color:var(--red)}
.ck{position:absolute;right:7px;bottom:5px;font-family:'DM Mono',monospace;font-size:.48rem;color:var(--green);opacity:.8}
.ppanel{border-top:1px solid var(--border);background:var(--bg);flex-shrink:0;max-height:360px;overflow-y:auto;position:relative}
.pinner{padding:13px}
.crm-name{font-family:'Lora',serif;font-size:1rem;font-weight:700;color:var(--txt);line-height:1.2}
.crm-addr{font-size:.68rem;color:var(--txt2);margin-top:3px;line-height:1.4}
.ctag{display:inline-block;font-family:'DM Mono',monospace;font-size:.5rem;text-transform:uppercase;letter-spacing:.1em;padding:2px 5px;border-radius:3px;margin-top:4px}
.ctag.cuy{background:rgba(37,99,235,.1);color:var(--accent)}
.ctag.gea{background:rgba(22,163,74,.1);color:var(--green)}
.ctag.unk{background:rgba(156,163,175,.15);color:var(--txt3)}
.psec-title{font-family:'DM Mono',monospace;font-size:.53rem;text-transform:uppercase;letter-spacing:.1em;color:var(--txt3);margin-bottom:6px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:4px;overflow:hidden;margin-bottom:7px}
.pcell{background:var(--surf);padding:6px 9px}
.pkey{font-family:'DM Mono',monospace;font-size:.5rem;text-transform:uppercase;letter-spacing:.08em;color:var(--txt3);margin-bottom:2px}
.pval{font-size:.74rem;color:var(--txt);font-weight:500}
.pval.big{font-family:'DM Mono',monospace;font-size:.8rem;color:var(--gold)}
.pval.grn{color:var(--green)}
.psrc{font-size:.56rem;color:var(--txt3);font-style:italic;margin-top:5px}
.hint{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;gap:5px;color:var(--txt3);font-size:.68rem}
.hint .hi{font-size:1.5rem;opacity:.2;margin-bottom:3px}
.loading-row{display:flex;align-items:center;gap:8px;padding:16px 13px;color:var(--txt3);font-size:.7rem}
.spin{width:13px;height:13px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.errblk{padding:12px 13px;color:var(--red);font-size:.7rem;line-height:1.6;display:flex;flex-direction:column;gap:8px}
.retry-btn{background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.25);color:var(--red);font-family:'DM Mono',monospace;font-size:.65rem;padding:5px 12px;border-radius:4px;cursor:pointer;align-self:flex-start}
.retry-btn:hover{background:rgba(220,38,38,.18)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:40px 24px;text-align:center;gap:10px}
.empty .ei{font-size:2.2rem;opacity:.12}
.empty .et{font-family:'Lora',serif;font-size:.9rem;color:var(--txt2)}
.empty .es{font-size:.67rem;color:var(--txt3);line-height:1.65;max-width:220px}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.pfbar{background:var(--surf2);border-top:1px solid var(--border);padding:7px 13px;display:flex;align-items:center;gap:9px;flex-shrink:0}
.pf-text{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--txt2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-stop{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--red);cursor:pointer;background:none;border:none;padding:0}
.mpin{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid rgba(0,0,0,.15)}
.mpin.pin-grey{background:var(--grey)}.mpin.pin-green{background:var(--green)}.mpin.pin-gold{background:var(--gold)}.mpin.pin-red{background:var(--red)}
.mpin.active{transform:rotate(-45deg) scale(1.3)}
.mpin-n{transform:rotate(45deg);font-family:'DM Mono',monospace;font-size:8px;color:#fff;font-weight:500}
.mpin.pin-gold .mpin-n{color:#333}
.tab-bar{display:flex;border-bottom:2px solid var(--border);background:var(--surf2);flex-shrink:0}
.tab-btn{flex:1;padding:8px 4px;font-family:'DM Mono',monospace;font-size:.6rem;border:none;background:none;color:var(--txt3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;letter-spacing:.03em}
.tab-btn:hover{color:var(--txt);background:var(--surf)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--surf)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center}
.modal{background:var(--surf);border:1px solid var(--border2);border-radius:10px;padding:28px;width:520px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal h2{font-family:'Lora',serif;font-size:1.2rem;margin-bottom:8px}
.modal p{font-size:.78rem;color:var(--txt2);line-height:1.65;margin-bottom:16px}
.modal label{display:block;font-family:'DM Mono',monospace;font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:var(--txt3);margin-bottom:4px}
.modal input{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--txt);padding:9px 11px;font-family:'DM Sans',sans-serif;font-size:.82rem;border-radius:5px;outline:none;margin-bottom:12px}
.modal input:focus{border-color:var(--accent)}
.modal-btns{display:flex;gap:10px;flex-wrap:wrap}
.modal-note{font-size:.67rem;color:var(--txt3);line-height:1.55;margin-bottom:16px;padding:9px 11px;background:var(--surf2);border-radius:4px;border-left:2px solid var(--border2)}
.ac-result-item{padding:10px 12px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px;cursor:pointer;transition:background .15s}
.ac-result-item:hover{background:var(--surf2);border-color:var(--accent)}
.ac-result-item.selected{background:rgba(37,99,235,.06);border-color:var(--accent)}
.ac-result-name{font-weight:600;font-size:.82rem;color:var(--txt)}
.ac-result-addr{font-size:.72rem;color:var(--txt2);margin-top:2px}
.ac-result-val{font-size:.68rem;color:var(--green);margin-top:2px;font-family:'DM Mono',monospace}
/* Mobile */
@media(max-width:768px){
  .legend{display:none}.toolbar{display:none}
  .main{flex-direction:column}
  #map{display:none}
  .sidebar{width:100%;height:100%;border-left:none}
  .ppanel{max-height:none;flex:1;overflow-y:auto}
  .mobile-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surf2);border-bottom:1px solid var(--border);flex-shrink:0}
  .mobile-bar input{flex:1;background:var(--bg);border:1px solid var(--border2);color:var(--txt);padding:7px 10px;font-family:'DM Sans',sans-serif;font-size:.85rem;border-radius:6px;outline:none}
  .mobile-add-btn{background:var(--accent);color:#fff;border:none;padding:7px 14px;border-radius:6px;font-size:.8rem;cursor:pointer;white-space:nowrap}
  .citem{padding:13px 12px}.cname{font-size:.9rem}.caddr{font-size:.75rem}
  .modal{width:95vw;padding:20px}
  .modal-btns{flex-direction:column}
  .modal-btns .btn{width:100%;padding:12px}
}
@media(min-width:769px){.mobile-bar{display:none}}
</style>
</head>
<body>

<!-- ADD CONTACT MODAL -->
<div class="modal-bg" id="addContactModal" style="display:none">
  <div class="modal">
    <h2>＋ Add New Contact</h2>
    <p>Enter the contact's details. The app will look up their property data automatically.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
      <div><label>First Name *</label><input type="text" id="ac_first" placeholder="Robert"></div>
      <div><label>Last Name *</label><input type="text" id="ac_last" placeholder="Cohen"></div>
      <div><label>Spouse First Name</label><input type="text" id="ac_spouse" placeholder="Beth"></div>
      <div><label>Phone</label><input type="tel" id="ac_phone" placeholder="216-555-1234"></div>
      <div style="grid-column:span 2"><label>Email</label><input type="email" id="ac_email" placeholder="robert@email.com"></div>
      <div style="grid-column:span 2"><label>Street Address *</label><input type="text" id="ac_street" placeholder="270 Applebrook Dr"></div>
      <div style="grid-column:span 2">
        <label>City *</label>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px">
          <button type="button" onclick="setCity('Chagrin Falls','44022')" style="font-size:.67rem;padding:4px 9px;border:1px solid var(--border2);border-radius:4px;background:var(--surf2);color:var(--txt);cursor:pointer">Chagrin Falls 44022</button>
          <button type="button" onclick="setCity('Chagrin Falls','44023')" style="font-size:.67rem;padding:4px 9px;border:1px solid var(--border2);border-radius:4px;background:var(--surf2);color:var(--txt);cursor:pointer">Chagrin Falls 44023</button>
          <button type="button" onclick="setCity('Bainbridge','44023')" style="font-size:.67rem;padding:4px 9px;border:1px solid var(--border2);border-radius:4px;background:var(--surf2);color:var(--txt);cursor:pointer">Bainbridge 44023</button>
          <button type="button" onclick="setCity('South Russell','44022')" style="font-size:.67rem;padding:4px 9px;border:1px solid var(--border2);border-radius:4px;background:var(--surf2);color:var(--txt);cursor:pointer">South Russell 44022</button>
          <button type="button" onclick="setCity('Bentleyville','44022')" style="font-size:.67rem;padding:4px 9px;border:1px solid var(--border2);border-radius:4px;background:var(--surf2);color:var(--txt);cursor:pointer">Bentleyville 44022</button>
        </div>
        <input type="text" id="ac_city" placeholder="Or type city name" style="margin-bottom:0">
      </div>
      <div style="grid-column:span 2">
        <label>ZIP</label>
        <div style="display:flex;gap:5px;margin-bottom:6px">
          <button type="button" onclick="setZip('44022')" style="font-size:.67rem;padding:4px 12px;border:1px solid var(--border2);border-radius:4px;background:var(--surf2);color:var(--txt);cursor:pointer">44022</button>
          <button type="button" onclick="setZip('44023')" style="font-size:.67rem;padding:4px 12px;border:1px solid var(--border2);border-radius:4px;background:var(--surf2);color:var(--txt);cursor:pointer">44023</button>
        </div>
        <input type="text" id="ac_zip" placeholder="Or type ZIP" maxlength="5" style="margin-bottom:0">
      </div>
    </div>
    <div id="ac_status" style="display:none;padding:9px;background:var(--surf2);border-radius:4px;margin-bottom:12px;font-size:.74rem;color:var(--txt2)"></div>
    <div id="ac_results" style="display:none;margin-bottom:12px"></div>
    <div class="modal-btns">
      <button class="btn btn-pri" id="ac_actionBtn" onclick="lookupByAddress()">📍 Look Up Property</button>
      <button class="btn btn-sec" onclick="hideAddContact()">Cancel</button>
    </div>
  </div>
</div>

<!-- CONFIRM ADD MODAL -->
<div class="modal-bg" id="confirmAddModal" style="display:none">
  <div class="modal">
    <h2>✅ Confirm Add Contact</h2>
    <div id="confirm_content" style="margin-bottom:16px"></div>
    <div class="modal-btns">
      <button class="btn btn-pri" onclick="confirmAddContact()">Add to Sheet</button>
      <button class="btn btn-sec" onclick="backToSearch()">← Back</button>
      <button class="btn btn-sec" onclick="hideAddContact()">Cancel</button>
    </div>
  </div>
</div>

<div id="app">
  <header class="hdr">
    <div class="logo">📍 <span>CRM</span> Property Map</div>
    <div class="legend" id="legend">
      <div class="leg-item"><div class="leg-dot" style="background:var(--grey)"></div><span id="leg0">No data</span></div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--green)"></div><span id="leg1">Tier 1</span></div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--gold)"></div><span id="leg2">Tier 2</span></div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--red)"></div><span id="leg3">Tier 3</span></div>
    </div>
    <div class="spacer"></div>
    <span class="total" id="totalLbl">Loading…</span>
  </header>

  <div class="toolbar">
    <span class="tlabel">Tiers</span>
    <div class="tier-wrap"><span class="tier-lbl green">Green &lt;</span><input type="number" class="tier-input" id="tier1" value="500000" oninput="recolorAll()"></div>
    <div class="tier-wrap"><span class="tier-lbl gold">Gold &lt;</span><input type="number" class="tier-input" id="tier2" value="1000000" oninput="recolorAll()"></div>
    <span class="tier-lbl red">Red ↑</span>
    <div class="toolbar-sep"></div>
    <span class="tlabel">Color by</span>
    <select id="colorBy" onchange="recolorAll()" style="background:var(--bg);border:1px solid var(--border2);color:var(--txt);padding:4px 7px;font-family:'DM Mono',monospace;font-size:.65rem;border-radius:4px;outline:none">
      <option value="value">Home Value</option>
      <option value="giving">Giving</option>
    </select>
    <div class="toolbar-sep"></div>
    <span class="tlabel">Filter</span>
    <input type="number" class="tier-input" id="minValue" placeholder="Min $" style="width:100px" oninput="applyFilter()">
    <button class="btn btn-sec" style="padding:4px 9px" onclick="clearFilter()">✕</button>
    <span id="filterCount" style="font-family:'DM Mono',monospace;font-size:.6rem;color:var(--txt3)"></span>
    <div class="toolbar-sep"></div>
    <button class="btn btn-gold" id="prefetchBtn" onclick="startPrefetch()" disabled>⚡ Pre-fetch All</button>
    <button class="btn btn-green" onclick="exportCSV()">⬇ Export</button>
    <button class="btn btn-pri" onclick="showAddContact()">＋ Add Contact</button>
    <button class="btn btn-sec" onclick="reloadSheet()">🔄 Refresh</button>
    <div class="prog-wrap" id="geoProgress" style="display:none">
      <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
      <span class="prog-lbl" id="progLbl">Loading…</span>
    </div>
  </div>

  <div class="main">
    <div id="map"></div>
    <div class="sidebar">
      <div class="mobile-bar">
        <input type="text" id="srch-mobile" placeholder="Search contacts…" oninput="mobileSrch()">
        <button class="mobile-add-btn" onclick="showAddContact()">＋ Add</button>
      </div>
      <div class="srch"><input type="text" id="srch" placeholder="Search contacts…" oninput="applyFilter()"></div>
      <div class="clist" id="clist"><div class="empty"><div class="ei">⏳</div><div class="et">Loading…</div></div></div>
      <div class="ppanel" id="ppanel"><div class="hint"><div class="hi">🏠</div><p>Select a contact to view details</p></div></div>
    </div>
  </div>

  <div class="pfbar" id="pfBar" style="display:none">
    <div class="spin"></div>
    <div class="pf-text" id="pfText">Starting…</div>
    <button class="pf-stop" onclick="stopPrefetch()">✕ Stop</button>
  </div>
</div>

// ── MAP ──
let map;
function initMap(){
  map=L.map('map',{zoomControl:true}).setView([41.45,-81.3],10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);
}

let households=[],filtered=[],markers=[],activeIdx=-1;
let donationsByContactId={};

const GEAUGA_ZIPS=new Set(['44021','44024','44026','44046','44047','44062','44072','44231','44234','44241','44255','44264']);
const BORDER_ZIPS=new Set(['44022','44023','44040','44086']);
function guessCounty(zip){const z=(zip||'').replace(/\D/g,'').substring(0,5);if(GEAUGA_ZIPS.has(z))return'gea';if(BORDER_ZIPS.has(z))return'unk';return'cuy';}

// ── LOAD SHEET ──
async function loadFromSheet(){
  showProgress(true,'Reading Google Sheet…',0);
  try{
    const r=await fetch(SHEET_URL+'?action=read');
    const rows=await r.json();
    const allRows=rows.slice(1); // keep all rows to preserve sheet row numbers
    const addrMap={};
    allRows.forEach((r,idx)=>{
      if(!r[0])return; // skip completely empty rows
      const contactName=(r[0]||'').toString().trim();
      const jointName=(r[1]||'').toString().trim();
      const address=(r[2]||'').toString().trim();
      const city=(r[3]||'').toString().trim();
      const state=(r[4]||'OH').toString().trim();
      const zip=(r[5]||'').toString().replace(/\D/g,'').substring(0,5);
      const phone=(r[6]||'').toString().trim();
      const contactId=(r[7]||'').toString().trim();
      const homeValue=r[8]?parseFloat(r[8])||null:null;
      const lat=r[9]?parseFloat(r[9])||null:null;
      const lon=r[10]?parseFloat(r[10])||null:null;
      const county=r[11]?(r[11]||'').toString().trim():guessCounty(zip);
      const propDetails=r[12]?tryParse(r[12]):null;
      const dateAdded=r[13]?(r[13]||'').toString().trim():'';
      const sheetRow=idx+2;
      if(!address){return;} // skip no-address rows for map (they come from donations sheet)
      const key=address.toLowerCase().trim()+'|'+zip;
      if(!addrMap[key])addrMap[key]={address,city,state,zip,county,lat,lon,homeValue,sheetRow,members:[],jointNames:[],propDetails,dateAdded,noAddress:false};
      const h=addrMap[key];
      h.members.push({contactName,phone,contactId,sheetRow,email:''});
      if(jointName&&!h.jointNames.includes(jointName))h.jointNames.push(jointName);
      if(homeValue&&!h.homeValue)h.homeValue=homeValue;
      if(lat&&!h.lat){h.lat=lat;h.lon=lon;}
      if(county&&county!=='unk'&&h.county==='unk')h.county=county;
      if(propDetails&&!h.propDetails)h.propDetails=propDetails;
      if(dateAdded&&!h.dateAdded)h.dateAdded=dateAdded;
    });
    households=Object.values(addrMap).map(h=>({...h,displayName:buildDisplayName(h)}));
    // Sort by last name
    households.sort((a,b)=>{
      const la=a.members[0]?.contactName.split(',')[0].trim().toLowerCase()||a.displayName.toLowerCase();
      const lb=b.members[0]?.contactName.split(',')[0].trim().toLowerCase()||b.displayName.toLowerCase();
      return la.localeCompare(lb);
    });
    filtered=[...households];
    markers=new Array(households.length).fill(null);
    renderList();
    document.getElementById('totalLbl').textContent=`${households.length} households`;
    document.getElementById('prefetchBtn').disabled=false;
    placeKnownPins();
    // Load donations in parallel
    loadDonations();
    const needsGeo=households.filter(h=>!h.lat&&!h.noAddress&&h.address);
    if(needsGeo.length>0)await geocodeMissing(needsGeo);
    else{showProgress(false);fitMap();}
  }catch(e){
    document.getElementById('clist').innerHTML=`<div class="empty"><div class="ei">⚠️</div><div class="et">Could not load</div><div class="es">${e.message}</div></div>`;
    showProgress(false);
  }
}

// ── DONATIONS ──
async function loadDonations(){
  try{
    const r=await fetch(SHEET_URL+'?action=readDonations');
    const rows=await r.json();
    if(!rows||rows.length<2)return;
    donationsByContactId={};
    rows.slice(1).forEach(row=>{
      if(!row[0])return;
      const contactId=(row[0]||'').toString().trim();
      const name=(row[1]||'').toString().trim();
      const amount=parseFloat((row[2]||'0').toString().replace(/[$,\s]/g,''))||0;
      const date=(row[3]||'').toString().trim();
      const notes=(row[4]||'').toString().trim();
      if(!contactId||!amount)return;
      if(!donationsByContactId[contactId])donationsByContactId[contactId]=[];
      donationsByContactId[contactId].push({name,amount,date,notes});
    });
    Object.keys(donationsByContactId).forEach(id=>{
      donationsByContactId[id].sort((a,b)=>new Date(b.date)-new Date(a.date));
    });
    mergeDonorsWithoutAddress();
    renderList();
  }catch(e){console.log('Donations error:',e.message);}
}

function mergeDonorsWithoutAddress(){
  const existingIds=new Set();
  households.forEach(h=>h.members.forEach(m=>{if(m.contactId)existingIds.add(m.contactId.toString());}));
  const seenIds=new Set();
  const newH=[];
  Object.keys(donationsByContactId).forEach(contactId=>{
    if(existingIds.has(contactId)||seenIds.has(contactId))return;
    seenIds.add(contactId);
    const donations=donationsByContactId[contactId];
    const donorName=donations[0]?.name||'';
    const parts=donorName.split(',');
    const displayName=parts.length>=2?parts[1].trim()+' '+parts[0].trim():donorName;
    newH.push({address:'',city:'',state:'',zip:'',county:'',displayName,members:[{contactName:donorName,phone:'',email:'',contactId,sheetRow:null}],jointNames:[],homeValue:null,propDetails:null,dateAdded:'',lat:null,lon:null,noAddress:true});
  });
  if(newH.length>0){
    households=[...households,...newH];
    filtered=[...households];
    markers=[...markers,...new Array(newH.length).fill(null)];
    document.getElementById('totalLbl').textContent=`${households.length} households · ${households.reduce((a,h)=>a+h.members.length,0)} contacts`;
    renderList();
  }
}

function getGivingStats(h){
  const all=[];
  h.members.forEach(m=>{(donationsByContactId[m.contactId]||[]).forEach(d=>all.push(d));});
  if(!all.length)return null;
  const seen=new Set();
  const unique=all.filter(d=>{const k=d.amount+'|'+d.date;if(seen.has(k))return false;seen.add(k);return true;});
  unique.sort((a,b)=>new Date(b.date)-new Date(a.date));
  const total=unique.reduce((s,d)=>s+d.amount,0);
  return{total,count:unique.length,largest:Math.max(...unique.map(d=>d.amount)),lastDate:unique[0]?.date||'',donations:unique};
}

function tryParse(v){try{return typeof v==='string'?JSON.parse(v):v;}catch(e){return null;}}

function reloadSheet(){
  households=[];filtered=[];markers.forEach(m=>m&&map.removeLayer(m));markers=[];
  activeIdx=-1;donationsByContactId={};setProp('hint');renderList();loadFromSheet();
}

// ── DISPLAY NAME ──
function buildDisplayName(h){
  if(h.jointNames.length>0)return h.jointNames[0];
  if(h.members.length===1)return fmtName(h.members[0].contactName);
  const firsts=h.members.map(m=>{const p=m.contactName.split(',');return p.length>=2?p[1].trim():m.contactName;});
  const last=h.members[0].contactName.split(',')[0].trim();
  return firsts.join(' & ')+' '+last;
}
function fmtName(cn){const p=cn.split(',');return p.length>=2?p[1].trim()+' '+p[0].trim():cn;}

// ── GEOCODE ──
function placeKnownPins(){households.forEach((h,i)=>{if(h.lat&&h.lon)placePinAt(i);});}
function placePinAt(i){
  const h=households[i];
  if(markers[i])map.removeLayer(markers[i]);
  const m=L.marker([h.lat,h.lon],{icon:pinIcon(i,false,getTier(i))}).addTo(map);
  m.on('click',()=>selectHousehold(i));
  markers[i]=m;
}
async function geocodeMissing(needsGeo){
  showProgress(true,`Geocoding ${needsGeo.length} addresses…`,0);
  for(let i=0;i<needsGeo.length;i++){
    const h=needsGeo[i];const idx=households.indexOf(h);
    document.getElementById('progLbl').textContent=`Geocoding ${i+1}/${needsGeo.length}…`;
    document.getElementById('progFill').style.width=`${Math.round((i/needsGeo.length)*100)}%`;
    const geo=await geocodeOne(h);
    if(geo){
      h.lat=geo.lat;h.lon=geo.lon;placePinAt(idx);renderList();
      for(const m of h.members)await writeRow([{row:m.sheetRow,col:10,value:geo.lat},{row:m.sheetRow,col:11,value:geo.lon}]);
    }
    if(i<needsGeo.length-1)await sleep(1200);
  }
  document.getElementById('progFill').style.width='100%';
  document.getElementById('progLbl').textContent='✓ Done';
  setTimeout(()=>showProgress(false),2000);fitMap();
}
async function geocodeOne(h){
  const q=encodeURIComponent(`${h.address}, ${h.city}, ${h.state} ${h.zip}, USA`);
  const attempts=[q,encodeURIComponent(`${h.address}, ${h.city}, ${h.state}, USA`),encodeURIComponent(`${h.address}, ${h.zip}, USA`)];
  for(const aq of attempts){
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${aq}&limit=1&countrycodes=us`,{headers:{'Accept-Language':'en','User-Agent':'CRMPropertyMap/1.0'}});
      const d=await r.json();
      if(d&&d.length)return{lat:+d[0].lat,lon:+d[0].lon};
      await sleep(500);
    }catch(e){}
  }
  return null;
}
function fitMap(){
  const v=households.filter(h=>h.lat);
  if(v.length>1){const lats=v.map(h=>h.lat),lons=v.map(h=>h.lon);map.fitBounds([[Math.min(...lats),Math.min(...lons)],[Math.max(...lats),Math.max(...lons)]],{padding:[50,50]});}
  else if(v.length===1)map.setView([v[0].lat,v[0].lon],14);
}

// ── WRITE ──
async function writeRow(updates){
  try{await fetch(SHEET_URL,{method:'POST',body:JSON.stringify({action:'writeRow',updates})});}catch(e){}
}

// ── TIERS ──
function getTier(i){
  const h=households[i];if(!h)return'grey';
  const mode=document.getElementById('colorBy')?.value||'value';
  if(mode==='giving'){
    const g=getGivingStats(h);if(!g)return'grey';
    if(g.total<1000)return'green';if(g.total<5000)return'gold';return'red';
  }
  const val=h.homeValue;if(!val)return'grey';
  const t1=parseFloat(document.getElementById('tier1').value)||500000;
  const t2=parseFloat(document.getElementById('tier2').value)||1000000;
  if(val<t1)return'green';if(val<t2)return'gold';return'red';
}
function recolorAll(){
  const mode=document.getElementById('colorBy')?.value||'value';
  if(mode==='giving'){
    document.getElementById('leg1').textContent='< $1,000';
    document.getElementById('leg2').textContent='< $5,000';
    document.getElementById('leg3').textContent='$5,000+';
  } else {
    const t1=parseFloat(document.getElementById('tier1').value)||500000;
    const t2=parseFloat(document.getElementById('tier2').value)||1000000;
    document.getElementById('leg1').textContent='< $'+t1.toLocaleString();
    document.getElementById('leg2').textContent='< $'+t2.toLocaleString();
    document.getElementById('leg3').textContent='$'+t2.toLocaleString()+'+';
  }
  households.forEach((h,i)=>{if(!markers[i])return;markers[i].setIcon(pinIcon(i,i===activeIdx,getTier(i)));});
  renderList();
}

// ── FILTER ──
function applyFilter(){
  const q=document.getElementById('srch').value.toLowerCase();
  const minVal=parseFloat(document.getElementById('minValue').value)||0;
  filtered=households.filter(h=>{
    const textMatch=h.displayName.toLowerCase().includes(q)||h.address.toLowerCase().includes(q)||h.city.toLowerCase().includes(q);
    if(!textMatch)return false;
    if(minVal>0)return h.homeValue&&h.homeValue>=minVal;
    return true;
  });
  households.forEach((h,i)=>{if(markers[i])markers[i].setOpacity(filtered.includes(h)?1:0.12);});
  document.getElementById('filterCount').textContent=minVal>0?`${filtered.length} match`:'';
  renderList();
}
function clearFilter(){
  document.getElementById('minValue').value='';document.getElementById('srch').value='';
  filtered=[...households];
  households.forEach((h,i)=>{if(markers[i])markers[i].setOpacity(1);});
  document.getElementById('filterCount').textContent='';renderList();
}
function mobileSrch(){document.getElementById('srch').value=document.getElementById('srch-mobile').value;applyFilter();}

// ── RENDER LIST ──
function renderList(){
  const el=document.getElementById('clist');
  if(!households.length){el.innerHTML='<div class="empty"><div class="ei">🗂️</div><div class="et">No contacts</div></div>';return;}
  if(!filtered.length){el.innerHTML='<div class="empty"><div class="ei">🔍</div><div class="et">No matches</div></div>';return;}
  const giving_summary=h=>{const g=getGivingStats(h);return g?`<div style="font-size:.6rem;color:var(--txt3);margin-top:1px">💝 $${Math.round(g.total).toLocaleString()} · ${g.count} gift${g.count!==1?'s':''}</div>`:'';}
  el.innerHTML=filtered.map(h=>{
    const i=households.indexOf(h);const tier=getTier(i);
    const phones=[...new Set(h.members.map(m=>m.phone).filter(Boolean))].join(' · ');
    const valStr=h.homeValue?'$'+h.homeValue.toLocaleString():'';
    return`<div class="citem${i===activeIdx?' active':''}${!filtered.includes(h)?' dimmed':''}" onclick="selectHousehold(${i})">
      <div class="pindot ${tier==='grey'?'':tier}">${i+1}</div>
      <div style="flex:1;min-width:0">
        <div class="cname">${h.displayName}</div>
        <div class="caddr">${h.noAddress?'<span style="color:var(--txt3);font-style:italic">No address on file</span>':h.address+', '+h.city+' '+h.zip}</div>
        ${phones?`<div class="cphone">${phones}</div>`:''}
        ${valStr?`<div class="cval ${tier}">${valStr}</div>`:''}
        ${giving_summary(h)}
      </div>
      ${h.homeValue?'<span class="ck">✓</span>':''}
    </div>`;
  }).join('');
}

// ── SELECT ──
async function selectHousehold(i){
  if(activeIdx!==-1&&markers[activeIdx])markers[activeIdx].setIcon(pinIcon(activeIdx,false,getTier(activeIdx)));
  activeIdx=i;const h=households[i];
  if(markers[i]){markers[i].setIcon(pinIcon(i,true,getTier(i)));map.setView([h.lat,h.lon],15,{animate:true});}
  renderList();
  if(h.propDetails||h.noAddress){setProp('data',h);return;}
  setProp('loading',h);
  const result=await fetchProp(h);
  if(!result.error){
    h.homeValue=result.homeValue||h.homeValue;h.propDetails=result;
    if(result.county&&result.county!=='unk')h.county=result.county;
    for(const m of h.members){
      const upd=[];
      if(h.homeValue)upd.push({row:m.sheetRow,col:9,value:h.homeValue});
      if(h.county)upd.push({row:m.sheetRow,col:12,value:h.county});
      if(h.propDetails)upd.push({row:m.sheetRow,col:13,value:JSON.stringify(h.propDetails)});
      if(upd.length)await writeRow(upd);
    }
    recolorAll();
  }
  renderList();setProp('data',h,result);
}

// ── PROP PANEL ──
function setProp(mode,h,result){
  const el=document.getElementById('ppanel');
  if(mode==='hint'){el.innerHTML='<div class="hint"><div class="hi">🏠</div><p>Select a contact to view details</p></div>';return;}
  const idx=households.indexOf(h);
  const countyLabel=h.noAddress?'No Address':h.county==='gea'?'Geauga County':h.county==='cuy'?'Cuyahoga County':'County Unknown';
  const tagClass=h.noAddress?'unk':h.county==='gea'?'gea':h.county==='cuy'?'cuy':'unk';
  const isMob=window.innerWidth<=768;
  const backBtn=`<button onclick="${isMob?'setProp(\'hint\')':'setProp(\'hint\')'}" style="position:absolute;top:8px;right:8px;background:none;border:none;cursor:pointer;font-size:1rem;color:var(--txt3);padding:2px 6px;border-radius:4px">✕</button>`;
  const giving=getGivingStats(h);
  const header=`<div class="pinner" style="padding-bottom:6px;position:relative">
    ${backBtn}
    <div class="crm-name" style="padding-right:24px">${h.displayName}</div>
    <div class="crm-addr" style="margin-bottom:4px">${h.noAddress?'<em style="color:var(--txt3)">No address on file</em>':h.address+', '+h.city+', '+h.state+' '+h.zip}</div>
    <span class="ctag ${tagClass}">${countyLabel}</span>
  </div>
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-prop-${idx}" onclick="showTab(${idx},'prop')">🏠 Property</button>
    <button class="tab-btn" id="tab-giving-${idx}" onclick="showTab(${idx},'giving')">💝 Giving${giving?' ('+giving.count+')':''}</button>
    <button class="tab-btn" id="tab-contacts-${idx}" onclick="showTab(${idx},'contacts')">👥 Contacts</button>
  </div>`;

  if(mode==='loading'){el.innerHTML=header+`<div class="loading-row"><div class="spin"></div><span>Loading property data…</span></div>`;return;}

  const data=result||h.propDetails||{};

  // Contacts tab
  const contactsHtml=h.members.map(m=>{
    const parts=m.contactName.split(',');
    const fullName=parts.length>=2?parts[1].trim()+' '+parts[0].trim():m.contactName;
    return`<div style="padding:9px 0;border-bottom:1px solid var(--border)">
      <div style="font-weight:600;font-size:.82rem;color:var(--txt)">${fullName}</div>
      ${m.phone?`<div style="font-size:.72rem;margin-top:3px"><a href="tel:${m.phone.replace(/[^0-9+]/g,'')}" style="color:var(--accent);text-decoration:none">📞 ${m.phone}</a></div>`:''}
      ${m.email?`<div style="font-size:.72rem;margin-top:2px"><a href="mailto:${m.email}" style="color:var(--accent);text-decoration:none">✉ ${m.email}</a></div>`:'<div style="font-size:.67rem;color:var(--txt3);margin-top:2px;font-style:italic">No email on file</div>'}
      <div style="font-family:DM Mono,monospace;font-size:.58rem;color:var(--txt3);margin-top:2px">CRM ID: ${m.contactId}</div>
    </div>`;
  }).join('');

  // Giving tab
  let givingHtml='';
  if(giving){
    const fd=d=>{try{return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}catch(e){return d;}};
    const fa=a=>'$'+a.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    givingHtml=`<div class="pgrid" style="margin-bottom:12px">
      <div class="pcell"><div class="pkey">Total Given</div><div class="pval big">${fa(giving.total)}</div></div>
      <div class="pcell"><div class="pkey">Gifts</div><div class="pval">${giving.count}</div></div>
      <div class="pcell"><div class="pkey">Largest Gift</div><div class="pval grn">${fa(giving.largest)}</div></div>
      <div class="pcell"><div class="pkey">Last Gift</div><div class="pval">${fd(giving.lastDate)}</div></div>
    </div>
    <div class="psec-title">Donation History</div>
    ${giving.donations.map(d=>`<div style="display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--border)">
      <div><div style="font-size:.78rem;font-weight:500;color:var(--txt)">${fa(d.amount)}</div>${d.notes?`<div style="font-size:.67rem;color:var(--txt3);margin-top:1px">${d.notes}</div>`:''}</div>
      <div style="font-size:.68rem;color:var(--txt3);white-space:nowrap;margin-left:12px">${fd(d.date)}</div>
    </div>`).join('')}`;
  }else{
    givingHtml='<div style="font-size:.78rem;color:var(--txt3);padding:8px 0">No donation history on file.</div>';
  }

  // Property tab
  const cells=[
    h.homeValue&&['Market Value','$'+Math.round(h.homeValue).toLocaleString(),'grn'],
    data.lastSalePrice&&['Last Sale Price',data.lastSalePrice,'big'],
    data.lastSaleDate&&['Sale Date',data.lastSaleDate,''],
    data.assessedValue&&['Assessed Value',data.assessedValue,''],
    data.propertyType&&['Type',data.propertyType,''],
    data.yearBuilt&&['Year Built',data.yearBuilt,''],
    data.squareFeet&&['Sq Ft',data.squareFeet,''],
    data.bedsBaths&&['Beds / Baths',data.bedsBaths,''],
    data.lotSize&&['Lot Size',data.lotSize,''],
    data.annualTax&&['Annual Tax',data.annualTax,''],
  ].filter(Boolean);
  const grid=h.noAddress
    ?`<div style="font-size:.8rem;color:var(--txt2);padding:8px 0">No address on file.<br><br><button class="retry-btn" style="background:rgba(37,99,235,.1);border-color:var(--accent);color:var(--accent)" onclick="hideAddContact();showAddContact()">＋ Add Address</button></div>`
    :cells.length?`<div class="pgrid">${cells.map(([k,v,cls])=>`<div class="pcell"><div class="pkey">${k}</div><div class="pval ${cls}">${v}</div></div>`).join('')}</div>`
    :'<div style="font-size:.7rem;color:var(--txt3)">No records retrieved.</div>';

  if(result&&result.error){
    el.innerHTML=header+`<div id="tabcontent-prop-${idx}" class="tab-content pinner">
      <div class="errblk"><span>${result.message}</span><button class="retry-btn" onclick="retryLookup(${idx})">↺ Retry</button></div>
    </div>
    <div id="tabcontent-giving-${idx}" class="tab-content pinner" style="display:none;padding-top:8px">${givingHtml}</div>
    <div id="tabcontent-contacts-${idx}" class="tab-content pinner" style="display:none;padding-top:8px">${contactsHtml}</div>`;
    return;
  }

  el.innerHTML=header+
    `<div id="tabcontent-prop-${idx}" class="tab-content pinner" style="padding-top:8px">${grid}${data.source?`<div class="psrc">Source: ${data.source}</div>`:''}</div>
    <div id="tabcontent-giving-${idx}" class="tab-content pinner" style="display:none;padding-top:8px">${givingHtml}</div>
    <div id="tabcontent-contacts-${idx}" class="tab-content pinner" style="display:none;padding-top:8px">${contactsHtml}</div>`;
}

function showTab(idx,tab){
  ['prop','giving','contacts'].forEach(t=>{
    const btn=document.getElementById(`tab-${t}-${idx}`);
    const content=document.getElementById(`tabcontent-${t}-${idx}`);
    if(btn)btn.classList.toggle('active',t===tab);
    if(content)content.style.display=t===tab?'block':'none';
  });
}
async function retryLookup(i){households[i].propDetails=null;households[i].homeValue=null;selectHousehold(i);}

// ── FETCH PROPERTY ──
async function fetchProp(h){
  if(!h.address||h.noAddress)return{error:true,message:'No address on file.'};
  const addr=encodeURIComponent(`${h.address}, ${h.city}, OH${h.zip?' '+h.zip:''}`);
  try{
    const resp=await fetch(`https://private-zillow.p.rapidapi.com/pro/byaddress?propertyaddress=${addr}`,{
      headers:{'Content-Type':'application/json','x-rapidapi-host':'private-zillow.p.rapidapi.com','x-rapidapi-key':RAPIDAPI_KEY}
    });
    const d=await resp.json();
    if(!d.propertyDetails)return{error:true,message:'Address not found on Zillow.'};
    const p=d.propertyDetails;const rf=p.resoFacts||{};
    const retNum=(p.streetAddress||'').match(/^\d+/);const reqNum=h.address.match(/^\d+/);
    if(retNum&&reqNum&&retNum[0]!==reqNum[0])return{error:true,message:`Address mismatch: Zillow returned ${p.streetAddress}`};
    const sales=(p.priceHistory||[]).filter(e=>e.event&&e.event.toLowerCase().includes('sold'));
    const lastSale=sales[0]||null;
    const countyStr=(p.county||'').toLowerCase();
    const homeValue=p.zestimate||p.lastSoldPrice||p.price||null;
    return{
      county:countyStr.includes('geauga')?'gea':'cuy',
      homeValue,
      lastSalePrice:lastSale?'$'+lastSale.price.toLocaleString():null,
      lastSaleDate:lastSale?new Date(lastSale.time).toLocaleDateString('en-US',{month:'long',year:'numeric'}):null,
      assessedValue:rf.taxAssessedValue?'$'+Math.round(rf.taxAssessedValue).toLocaleString():null,
      marketValue:homeValue?'$'+Math.round(homeValue).toLocaleString():null,
      propertyType:rf.homeType||p.homeType||'Single Family',
      yearBuilt:rf.yearBuilt?String(rf.yearBuilt):null,
      squareFeet:p.livingArea?p.livingArea.toLocaleString():null,
      bedsBaths:p.bedrooms&&p.bathrooms?`${p.bedrooms} / ${p.bathrooms}`:null,
      lotSize:rf.lotSize||(p.lotAreaValue?`${p.lotAreaValue} ${p.lotAreaUnits||'acres'}`:null),
      annualTax:rf.taxAnnualAmount?'$'+rf.taxAnnualAmount.toLocaleString():null,
      source:'Zillow'
    };
  }catch(e){return{error:true,message:'Lookup failed: '+e.message};}
}

// ── PREFETCH ──
let prefetching=false;
async function startPrefetch(){
  const unfetched=households.filter(h=>!h.homeValue&&!h.noAddress);
  if(!unfetched.length){alert('All households already have property data!');return;}
  const ok=window.confirm(`Look up property for ${unfetched.length} households?\nEst. time: ~${Math.ceil(unfetched.length/60)} min\n\nContinue?`);
  if(!ok)return;
  prefetching=true;
  document.getElementById('pfBar').style.display='flex';
  document.getElementById('prefetchBtn').disabled=true;
  let done=0,failed=0;
  for(let i=0;i<households.length;i++){
    if(!prefetching)break;
    const h=households[i];
    if(h.homeValue||h.noAddress||!h.address)continue;
    document.getElementById('pfText').textContent=`[${done+failed+1}/${unfetched.length}] ${h.displayName}`;
    const result=await fetchProp(h);
    if(!result.error){
      h.homeValue=result.homeValue;h.propDetails=result;
      if(result.county&&result.county!=='unk')h.county=result.county;
      for(const m of h.members){
        const upd=[];
        if(h.homeValue)upd.push({row:m.sheetRow,col:9,value:h.homeValue});
        if(h.county)upd.push({row:m.sheetRow,col:12,value:h.county});
        if(h.propDetails)upd.push({row:m.sheetRow,col:13,value:JSON.stringify(h.propDetails)});
        if(upd.length)await writeRow(upd);
      }
      recolorAll();done++;
    }else{failed++;}
    renderList();await sleep(1000);
  }
  prefetching=false;
  document.getElementById('pfBar').style.display='none';
  document.getElementById('prefetchBtn').disabled=false;
  document.getElementById('prefetchBtn').textContent=`✓ ${done} fetched`;
  if(failed>0)alert(`Done!\n${done} succeeded\n${failed} failed — click individually to retry.`);
}
function stopPrefetch(){prefetching=false;document.getElementById('pfBar').style.display='none';document.getElementById('prefetchBtn').disabled=false;}

// ── EXPORT ──
function exportCSV(){
  const minVal=parseFloat(document.getElementById('minValue').value)||0;
  const sinceDate=prompt('Export contacts added since date?\n\nEnter date (YYYY-MM-DD) or leave blank for all:','');
  const since=sinceDate?sinceDate.trim():null;
  let list=minVal>0?filtered:households;
  if(since)list=list.filter(h=>!h.dateAdded||h.dateAdded>=since);
  if(!list.length){alert('No contacts match.');return;}
  const rows=[['Contact ID','First Name','Last Name','Address Notes']];
  list.forEach(h=>{
    h.members.forEach(m=>{
      const parts=m.contactName.split(',');
      const last=parts.length>=2?parts[0].trim():'';
      const first=parts.length>=2?parts[1].trim():m.contactName;
      const fmtVal=h.homeValue?'$'+Math.round(h.homeValue).toLocaleString('en-US'):'';
      rows.push([m.contactId,first,last,fmtVal]);
    });
  });
  const csv=rows.map(r=>r.map(v=>`"${(v||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=since?`contacts_since_${since}.csv`:minVal>0?`prospects_above_${minVal}.csv`:'all_contacts.csv';
  a.click();
}

let acSelectedResult=null,acFormData={};
function showAddContact(){document.getElementById('addContactModal').style.display='flex';document.getElementById('ac_first').focus();document.getElementById('ac_status').style.display='none';document.getElementById('ac_results').style.display='none';}
function hideAddContact(){document.getElementById('addContactModal').style.display='none';document.getElementById('confirmAddModal').style.display='none';['ac_first','ac_last','ac_spouse','ac_phone','ac_email','ac_street','ac_city','ac_zip'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});document.getElementById('ac_status').style.display='none';}

async function lookupByAddress(){
  const first=document.getElementById('ac_first').value.trim();
  const last=document.getElementById('ac_last').value.trim();
  const street=document.getElementById('ac_street').value.trim();
  const city=document.getElementById('ac_city').value.trim()||'Chagrin Falls';
  const zip=document.getElementById('ac_zip').value.trim();
  if(!first||!last){alert('Please enter first and last name.');return;}
  if(!street){alert('Please enter a street address.');return;}
  acFormData={first,last,spouse:document.getElementById('ac_spouse').value.trim(),phone:document.getElementById('ac_phone').value.trim(),email:document.getElementById('ac_email').value.trim()};
  const btn=document.getElementById('ac_actionBtn');btn.disabled=true;btn.textContent='⏳ Looking up…';
  const status=document.getElementById('ac_status');status.style.display='block';status.textContent='Fetching from Zillow…';
  try{
    const fullAddr=encodeURIComponent(`${street}, ${city}, OH${zip?' '+zip:''}`);
    const resp=await fetch(`https://private-zillow.p.rapidapi.com/pro/byaddress?propertyaddress=${fullAddr}`,{headers:{'Content-Type':'application/json','x-rapidapi-host':'private-zillow.p.rapidapi.com','x-rapidapi-key':RAPIDAPI_KEY}});
    const d=await resp.json();
    if(!d.propertyDetails)throw new Error('Address not found on Zillow.');
    const p=d.propertyDetails;const rf=p.resoFacts||{};
    const sales=(p.priceHistory||[]).filter(e=>e.event&&e.event.toLowerCase().includes('sold'));
    const lastSale=sales[0]||null;
    const countyStr=(p.county||'').toLowerCase();
    acSelectedResult={
      address:p.streetAddress||street,city:p.city||city,state:p.state||'OH',zip:p.zipcode||zip,
      county:countyStr.includes('geauga')?'gea':'cuy',
      marketValue:p.zestimate||p.price||null,
      yearBuilt:p.yearBuilt?String(p.yearBuilt):null,
      propertyType:p.homeType||'Single Family',
      lastSalePrice:lastSale?'$'+lastSale.price.toLocaleString():null,
      lastSaleDate:lastSale?new Date(lastSale.time).toLocaleDateString('en-US',{month:'long',year:'numeric'}):null,
      assessedValue:rf.taxAssessedValue?'$'+Math.round(rf.taxAssessedValue).toLocaleString():null,
      annualTax:rf.taxAnnualAmount?'$'+rf.taxAnnualAmount.toLocaleString():null,
      squareFeet:p.livingArea?p.livingArea.toLocaleString():null,
      bedsBaths:p.bedrooms&&p.bathrooms?`${p.bedrooms} / ${p.bathrooms}`:null,
      lotSize:rf.lotSize||(p.lotAreaValue?`${p.lotAreaValue} ${p.lotAreaUnits||'acres'}`:null)
    };
    const r=acSelectedResult;
    const jointName=acFormData.spouse?`${acFormData.first} and ${acFormData.spouse} ${acFormData.last}`:`${acFormData.first} ${acFormData.last}`;
    document.getElementById('confirm_content').innerHTML=`
      <div style="background:var(--surf2);border-radius:6px;padding:14px;margin-bottom:12px">
        <div style="font-weight:700;font-size:.88rem;color:var(--txt);margin-bottom:6px">Contact</div>
        <div style="font-size:.78rem;color:var(--txt2);line-height:1.8">
          <b>Name:</b> ${acFormData.last}, ${acFormData.first}<br>
          <b>Joint Name:</b> ${jointName}<br>
          ${acFormData.phone?`<b>Phone:</b> ${acFormData.phone}<br>`:''}
          ${acFormData.email?`<b>Email:</b> ${acFormData.email}<br>`:''}
        </div>
      </div>
      <div style="background:var(--surf2);border-radius:6px;padding:14px">
        <div style="font-weight:700;font-size:.88rem;color:var(--txt);margin-bottom:6px">Property Found</div>
        <div style="font-size:.78rem;color:var(--txt2);line-height:1.8">
          <b>Address:</b> ${r.address}, ${r.city}, ${r.state} ${r.zip}<br>
          <b>County:</b> ${r.county==='gea'?'Geauga':'Cuyahoga'}<br>
          ${r.marketValue?`<b>Est. Value:</b> $${Math.round(r.marketValue).toLocaleString()}<br>`:''}
        </div>
      </div>`;
    status.style.display='none';
    document.getElementById('addContactModal').style.display='none';
    document.getElementById('confirmAddModal').style.display='flex';
  }catch(e){status.textContent='⚠ '+e.message;}
  btn.disabled=false;btn.textContent='📍 Look Up Property';
}

async function confirmAddContact(){
  if(!acSelectedResult)return;
  const r=acSelectedResult;const today=new Date().toISOString().split('T')[0];
  const jointName=acFormData.spouse?`${acFormData.first} and ${acFormData.spouse} ${acFormData.last}`:`${acFormData.first} ${acFormData.last}`;
  const baseRow=['',jointName,r.address,r.city,r.state,r.zip,acFormData.phone,'',r.marketValue||'','','',r.county,JSON.stringify({lastSalePrice:r.lastSalePrice,lastSaleDate:r.lastSaleDate,assessedValue:r.assessedValue,marketValue:r.marketValue?'$'+Math.round(r.marketValue).toLocaleString():null,propertyType:r.propertyType,yearBuilt:r.yearBuilt,squareFeet:r.squareFeet,bedsBaths:r.bedsBaths,lotSize:r.lotSize,annualTax:r.annualTax,source:'Zillow'}),today];
  const rows=[];
  const row1=[...baseRow];row1[0]=`${acFormData.last}, ${acFormData.first}`;row1[6]=acFormData.phone;rows.push(row1);
  if(acFormData.spouse){
    const row2=[...baseRow];const sp=acFormData.spouse.trim().split(' ');
    const spLast=sp.length>1?sp[sp.length-1]:acFormData.last;const spFirst=sp.length>1?sp.slice(0,-1).join(' '):acFormData.spouse;
    row2[0]=`${spLast}, ${spFirst}`;row2[6]='';rows.push(row2);
  }
  try{
    for(const row of rows)await fetch(SHEET_URL,{method:'POST',body:JSON.stringify({action:'append',values:row})});
    hideAddContact();
    const newH={address:r.address,city:r.city,state:r.state,zip:r.zip,county:r.county,
      displayName:acFormData.spouse?`${acFormData.first} and ${acFormData.spouse} ${acFormData.last}`:`${acFormData.first} ${acFormData.last}`,
      members:rows.map((row,i)=>({contactName:row[0],phone:i===0?acFormData.phone:'',email:i===0?acFormData.email:'',contactId:'',sheetRow:999})),
      jointNames:[],homeValue:r.marketValue||null,propDetails:{lastSalePrice:r.lastSalePrice,lastSaleDate:r.lastSaleDate,assessedValue:r.assessedValue,marketValue:r.marketValue?'$'+Math.round(r.marketValue).toLocaleString():null,propertyType:r.propertyType,yearBuilt:r.yearBuilt,squareFeet:r.squareFeet,bedsBaths:r.bedsBaths,lotSize:r.lotSize,annualTax:r.annualTax,source:'Zillow'},
      dateAdded:today,lat:null,lon:null,noAddress:false};
    households.push(newH);filtered=[...households];markers.push(null);renderList();
    document.getElementById('totalLbl').textContent=`${households.length} households · ${households.reduce((a,h)=>a+h.members.length,0)} contacts`;
    const newIdx=households.length-1;const geo=await geocodeOne(newH);
    if(geo){newH.lat=geo.lat;newH.lon=geo.lon;placePinAt(newIdx);map.setView([geo.lat,geo.lon],15,{animate:true});}
    renderList();
  }catch(e){alert('Failed to save: '+e.message);}
}
