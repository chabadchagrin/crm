<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Email Preferences — Chabad at the Falls</title>
<style>
  body{margin:0;background:#faf7f2;font-family:Georgia,'Times New Roman',serif;color:#292524;
       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;box-sizing:border-box}
  .card{background:#fff;border:1px solid #e7e0d6;border-radius:14px;max-width:460px;width:100%;
        padding:36px 32px;text-align:center;box-shadow:0 6px 24px rgba(41,37,36,.07)}
  .org{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#0f766e;
       font-family:Helvetica,Arial,sans-serif;margin-bottom:18px}
  h1{font-size:1.35rem;margin:0 0 12px;color:#1c1917}
  p{font-size:.95rem;line-height:1.65;color:#57534e;margin:0 0 20px}
  .btn{display:inline-block;background:#0f766e;color:#fff;text-decoration:none;border:none;cursor:pointer;
       font-family:Helvetica,Arial,sans-serif;font-size:.85rem;padding:10px 22px;border-radius:8px}
  .btn:disabled{opacity:.5;cursor:default}
  .foot{margin-top:22px;font-size:.7rem;color:#a8a29e;font-family:Helvetica,Arial,sans-serif}
  .spin{display:inline-block;width:18px;height:18px;border:2px solid #e7e0d6;border-top-color:#0f766e;
        border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="card">
    <div class="org">Chabad at the Falls</div>
    <h1 id="t">One moment…</h1>
    <p id="m"><span class="spin"></span>Updating your email preferences.</p>
    <button class="btn" id="b" style="display:none"></button>
    <div class="foot">Chabad at the Falls<br>jewishchagrinfalls.com</div>
  </div>
<script>
(function(){
  var API='https://sdzbzdoncakpsnfapbxj.supabase.co/functions/v1/email-unsub';
  var t=document.getElementById('t'), m=document.getElementById('m'), b=document.getElementById('b');
  var token=(new URLSearchParams(location.search).get('u')||'').trim();
  function show(title,msg,btnLabel,btnFn){
    t.textContent=title; m.textContent=msg;
    if(btnLabel){ b.textContent=btnLabel; b.style.display='inline-block'; b.disabled=false; b.onclick=btnFn; }
    else b.style.display='none';
  }
  function call(action){
    b.disabled=true;
    return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({token:token,action:action})})
      .then(function(r){ return r.json(); });
  }
  function fail(){
    show('Something went wrong',
      'We couldn\u2019t process this just now. Please try again in a moment, or reply to any of our emails and we\u2019ll take you off the list by hand.');
  }
  if(!token){
    show('Link problem',
      'This link is missing its code or was cut off. Please open it directly from the email, or reply to the email and we\u2019ll take you off the list by hand.');
    return;
  }
  // One-click unsubscribe on arrival (matches the link's promise).
  call('unsubscribe').then(function(j){
    if(!j||!j.ok){ 
      show('Link problem',
        'We couldn\u2019t find a mailing-list record for this link. It may be from an old email. Reply to any of our emails and we\u2019ll take care of it by hand.');
      return;
    }
    if(j.already){
      show('Already unsubscribed','You were already off the list \u2014 no further emails will be sent to you.','Resubscribe',resub);
    }else{
      show('You\u2019ve been unsubscribed','You won\u2019t receive any more emails from Chabad at the Falls. If this was a mistake, you can rejoin with one click.','Resubscribe',resub);
    }
  }).catch(fail);
  function resub(){
    show('One moment\u2026','Adding you back to the list.');
    call('resubscribe').then(function(j){
      if(j&&j.ok)show('Welcome back!','You\u2019ve been resubscribed and will receive our emails again. We\u2019re glad to have you.');
      else fail();
    }).catch(fail);
  }
})();
</script>
</body>
</html>
